<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Ripple{% endblock %}</title>
<link rel="stylesheet" href="/static/css/ripple-fonts.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/css/ripple-tokens.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body{% if active %} data-list="{{ active }}"{% endif %}>
<div class="win" id="shell">
  <aside class="side">
    <div class="side-top">
      <div class="lights"><i class="l1"></i><i class="l2"></i><i class="l3"></i></div>
      <a href="/" class="mark" data-tip="Library" aria-label="Ripple library"></a>
      <span class="ver num" data-tip="Ripple version">v{{ app_version }}</span>
    </div>
    {% block sidebar %}{% endblock %}
  </aside>

  <div class="main">
    <div class="bar">
      <button class="toggle" id="toggle-side" data-tip="Show or hide the sidebar"
              aria-label="Toggle sidebar">☰</button>
      <div class="nav">
        <a href="javascript:history.back()" data-tip="Back" aria-label="Back">‹</a>
        <a href="javascript:history.forward()" data-tip="Forward" aria-label="Forward">›</a>
      </div>
      {% block toolbar %}{% endblock %}
    </div>
    <div class="content {% block content_class %}{% endblock %}">{% block content %}{% endblock %}</div>
  </div>
</div>
{% block overlay %}{% endblock %}
<script src="/static/js/app.js?v={{ asset_version }}"></script>
<script src="/static/js/screensaver.js?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
