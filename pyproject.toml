[project]
name = "ripple"
version = "0.1.0"
description = "Script graph agents for production impact analysis"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "pdf-inspector>=0.2.6",
    "traceact==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-randomly",
    "reportlab",
    "pypdf",
    "screenplain==0.12.0",
    "black",
    "ruff",
]

[project.urls]
Changelog = "https://github.com/shehuphd/ripple/blob/main/CHANGELOG.md"

# Without this, setuptools' flat-layout discovery treats every top-level
# directory as a package and fails on data/, internal/, tests/, and tools/.
[tool.setuptools.packages.find]
include = ["ripple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-randomly stays enabled: a failure caused by test order is a real bug.
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"
