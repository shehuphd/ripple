[project]
name = "ripple"
version = "0.1.0"
description = "Script graph agents for production impact analysis"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "pdf-inspector>=0.2.6",
    "traceact==0.14.0",
    "keycall[traceact]==0.8.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-randomly",
    "reportlab",
    "pypdf",
    "screenplain==0.12.0",
    "black",
    "ruff",
    "httpx",
]

[project.urls]
Changelog = "https://github.com/shehuphd/ripple/blob/main/CHANGELOG.md"

# Without this, setuptools' flat-layout discovery treats every top-level
# directory as a package and fails on data/, project/, tests/, and tools/.
[tool.setuptools.packages.find]
include = ["ripple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-randomly stays enabled: a failure caused by test order is a real bug.
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# B008 forbids a function call in an argument default. FastAPI's dependency
# injection is expressed exactly that way (Depends, File, Form), so the rule
# does not apply to route handlers. Scoped to the web module rather than
# disabled globally, where it would still catch a genuine mutable default.
"ripple/web/app.py" = ["B008"]
