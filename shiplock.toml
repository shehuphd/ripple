# Shiplock: docs-vs-code release checks. Run `shiplock check` here, or let
# tests/test_docs.py run the same gate inside pytest.

[docs]
public = ["README.md", "USAGE.md", "ARCHITECTURE.md", "CHANGELOG.md", "MANIFEST.md"]
changelog = "CHANGELOG.md"
readme = "README.md"

[version]
package = "ripple"

# The words beyond shiplock's built-in list. Word-boundary matching spares
# identifiers (clearRect, gap:12px inside a token), and only the public docs
# are swept, so a code keyword such as SQL's REAL is out of the gate's reach
# unless it is quoted in prose.
[style]
extra_banned = [
    "mattered", "clean", "clear", "stayed", "simple", "plainly",
]
# "shape" and "shaped" stay off the extra list: a literal description
# ("credential-shaped", "the one ambiguous shape on the page") is fine, and
# the STRuFO template requires the heading "### Shape" in ARCHITECTURE.md.
# The verb tic ("shapes the design") is caught by the built-in "shapes".
allow = []

[architecture]
doc = "ARCHITECTURE.md"
source_dir = "ripple"

# No [[coverage]] entries: the enumerated vocabularies here (IMPORT_OUTCOMES,
# MODEL_CALL_OUTCOMES) are plain tuples backing CHECK constraints, not Enum
# classes, and the coverage check reads Enums only.

[manifest]
doc = "MANIFEST.md"
sources = [
    "ripple/**/*.py",
    "ripple/web/templates/*.html",
    "ripple/web/static/**/*.css",
    "ripple/web/static/**/*.js",
    "tests/*.py",
    "tools/*.py",
]

# The requirements file went in the 2026-09-06 ablation pass; this keeps one
# from coming back beside the pyproject dependency list.
[deps]
requirements = ["requirements*.txt", "tools/requirements*.txt"]

# The audit-the-suite rule, enforced: a test that only checks a call does not
# raise pins nothing.
[tests]
globs = ["tests/**/*.py"]
