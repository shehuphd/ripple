# Shiplock: docs-vs-code release checks. Run `shiplock check` here, or let
# tests/test_docs.py run the same gate inside pytest.

[docs]
public = ["README.md", "USAGE.md", "ARCHITECTURE.md", "CHANGELOG.md", "MANIFEST.md"]
changelog = "CHANGELOG.md"
readme = "README.md"

[version]
package = "ripple"

[architecture]
doc = "ARCHITECTURE.md"
source_dir = "ripple"

# No [[coverage]] entries: the enumerated vocabularies here (IMPORT_OUTCOMES,
# MODEL_CALL_OUTCOMES) are plain tuples backing CHECK constraints, not Enum
# classes, and the coverage check reads Enums only.

[manifest]
doc = "MANIFEST.md"
sources = [
    "ripple/**/*.py",
    "ripple/web/templates/*.html",
    "ripple/web/static/**/*.css",
    "ripple/web/static/**/*.js",
    "tests/*.py",
    "tools/*.py",
]

# The requirements file went in the 2026-09-06 ablation pass; this keeps one
# from coming back beside the pyproject dependency list.
[deps]
requirements = ["requirements*.txt", "tools/requirements*.txt"]

# The audit-the-suite rule, enforced: a test that only checks a call does not
# raise pins nothing.
[tests]
globs = ["tests/**/*.py"]
